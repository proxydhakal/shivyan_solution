{% if site.meta_keywords %}
  <meta name="keywords" content="{{ site.meta_keywords|striptags }}" />
{% endif %}
{% if site.favicon %}
  <link rel="icon" href="{{ site.favicon.url }}" />
  <link rel="shortcut icon" href="{{ site.favicon.url }}" />
{% endif %}
{% if site.apple_touch_icon %}
  <link rel="apple-touch-icon" href="{{ site.apple_touch_icon.url }}" />
{% endif %}
{% if request %}
  <meta property="og:site_name" content="{{ site.company_name }}" />
  <meta property="og:locale" content="ne_NP" />
  <meta name="twitter:card" content="summary_large_image" />
{% endif %}
