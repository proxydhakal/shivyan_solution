{% comment %}
  mode: "nav" (navbar) or "footer"
{% endcomment %}
{% load static %}
{% if site.logo %}
<a
  href="{% url 'home' %}"
  class="{% if mode == 'nav' %}flex items-center min-w-0 flex-shrink-0{% else %}inline-flex items-center mb-4{% endif %}"
>
  <span
    class="bg-white rounded-2xl border border-white/10 shadow-sm overflow-hidden flex items-center justify-center {% if mode == 'nav' %}p-2{% else %}p-2.5{% endif %}"
    aria-hidden="true"
  >
    <img
      src="{{ site.logo.url }}"
      alt="{{ site.company_name }}"
      class="{% if mode == 'nav' %}h-11 w-auto max-h-11 max-w-[300px] object-contain{% else %}h-12 w-auto max-w-[340px] object-contain{% endif %}"
      width="320"
      height="80"
      loading="eager"
      decoding="async"
    />
  </span>
</a>
{% else %}
{# Static fallback logo (deploy with static/images/logo.png) #}
<a
  href="{% url 'home' %}"
  class="{% if mode == 'nav' %}flex items-center min-w-0 flex-shrink-0{% else %}inline-flex items-center mb-4{% endif %}"
>
  <span
    class="bg-white rounded-2xl border border-white/10 shadow-sm overflow-hidden flex items-center justify-center {% if mode == 'nav' %}p-2{% else %}p-2.5{% endif %}"
    aria-hidden="true"
  >
    <img
      src="{% static 'images/logo.png' %}"
      alt="{{ site.company_name }}"
      class="{% if mode == 'nav' %}h-11 w-auto max-h-11 max-w-[300px] object-contain{% else %}h-12 w-auto max-w-[340px] object-contain{% endif %}"
      width="320"
      height="80"
      loading="eager"
      decoding="async"
    />
  </span>
</a>
{% endif %}
