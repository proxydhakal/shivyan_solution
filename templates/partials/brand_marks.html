{% comment %}
  mode: "nav" (navbar) or "footer"
{% endcomment %}
{% load static %}
{% if site.logo %}
<a
  href="{% url 'home' %}"
  class="{% if mode == 'nav' %}flex items-center min-w-0 flex-shrink-0{% else %}inline-flex items-center mb-4{% endif %}"
>
  <img
    src="{{ site.logo.url }}"
    alt="{{ site.company_name }}"
    class="{% if mode == 'nav' %}h-12 w-auto max-h-12 max-w-[260px] object-contain object-left md:max-w-[320px]{% else %}h-12 w-auto max-w-[320px] object-contain object-left{% endif %}"
    width="240"
    height="40"
    loading="eager"
    decoding="async"
  />
</a>
{% else %}
{# Static fallback logo (deploy with static/images/logo.png) #}
<a
  href="{% url 'home' %}"
  class="{% if mode == 'nav' %}flex items-center min-w-0 flex-shrink-0{% else %}inline-flex items-center mb-4{% endif %}"
>
  <img
    src="{% static 'images/logo.png' %}"
    alt="{{ site.company_name }}"
    class="{% if mode == 'nav' %}h-12 w-auto max-h-12 max-w-[260px] object-contain object-left md:max-w-[320px]{% else %}h-12 w-auto max-w-[320px] object-contain object-left{% endif %}"
    width="320"
    height="80"
    loading="eager"
    decoding="async"
  />
</a>
{% endif %}
